<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b7791f">
  <title>Fatti Conti – Pesate</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="btnBack" class="icon-btn hidden" aria-label="Indietro">&#8592;</button>
    <h1 id="title">Ritiri</h1>
    <span class="spacer"></span>
    <span id="syncBadge" class="badge hidden" style="background:#e3f4ea;color:#1e6340;cursor:pointer" title="Stato sincronizzazione">&#9729; sincronizzato</span>
    <span id="offline" class="badge hidden" style="background:#fff;color:#8a5a12">&#9888; offline</span>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button data-tab="ritiri" class="active"><span>&#128230;</span>Ritiri</button>
    <button data-tab="conti"><span>&#128203;</span>Conti</button>
    <button data-tab="merci"><span>&#129472;</span>Merci</button>
    <button data-tab="fornitori"><span>&#128666;</span>Fornitori</button>
    <button data-tab="impostazioni"><span>&#9881;</span>Impostazioni</button>
  </nav>

  <div id="toast" class="toast"></div>
  <dialog id="dialog"></dialog>

  <div id="lockScreen" class="lock-screen hidden">
    <div class="lock-card">
      <div class="lock-icon">&#128274;</div>
      <h2>Fatti Conti</h2>
      <p class="muted">Accesso protetto. Sblocca per visualizzare i tuoi dati.</p>
      <button id="btnBioUnlock" class="btn primary block hidden" style="margin-top:1.2rem;font-size:1.05rem;padding:.8rem">&#128070; Sblocca con Impronta / Viso</button>
      <div id="pinUnlockRow" style="margin-top:1.2rem">
        <label style="text-align:left;display:block;margin-bottom:.3rem">PIN o Password</label>
        <div style="display:flex;gap:.5rem">
          <input type="password" id="inputPin" placeholder="Inserisci PIN o password" style="flex:1">
          <button id="btnPinUnlock" class="btn primary">Sblocca</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
